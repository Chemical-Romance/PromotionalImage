# promotional-image —— Nginx SPA + AI 反代配置（容器内使用）
# 路径：/etc/nginx/conf.d/default.conf
# 不要加 server_name（容器直接 listen 80 即可）

upstream ai_proxy {
    # Docker Compose 网络里，AI 代理服务名就是 hostname
    server promotional-image-ai:3100;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ========== AI 代理反代 ==========
    location /api/ai/ {
        proxy_pass http://ai_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 支持流式响应
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # ========== SPA 路由 fallback ==========
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========== 静态资源强缓存 ==========
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /frames/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========== Gzip ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;
    gzip_min_length 1024;
}
